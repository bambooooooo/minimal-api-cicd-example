name: Deploy on test

on:
    workflow_run:
        workflows:
            - Build
        types:
            - completed

permissions:
    actions: read
    contents: read

concurrency:
    group: deploy-test
    cancel-in-progress: false

env:
    SERVICE_NAME: 'MyComApi'
    DEPLOY_ROOT: 'C:\Apps\MyComApi'
    HEALTH_URL: 'http://127.0.0.1:5000/health'

jobs:
    deploy:
        name: Deploy artifact to TEST
        if: >-
            github.event.workflow_run.conclusion == 'success' && 
            github.event.workflow_run.head_branch == 'develop'
        runs-on: [self-hosted, Windows, X64]
        timeout-minutes: 15

        steps:

            - name: Checkout deployment scripts from tested commit
              uses: actions/checkout@v7
              with:
                ref: ${{ github.event.workflow_run.head_sha }}
                fetch-depth: 1
                persist-credentials: false

            - name: Download extact CI artefact
              uses: actions/download-artifact@v8
              with:
                name: MyComApi-${{ github.sha }}
                path: ${{ runner.temp }}\deployment-artifact
                run-id: ${{ github.event.workflow_run.id }}
                github-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Verify artifact download
              shell: pwsh
              run: |
                $artifactDIr = "${{ runner.temp }}\deployment-artifact"
                $items = Get-ChildItem $artifactDir -ErrorAction SilentlyContinue
                if (-not $items) {
                    throw "Artifact directory is empty: $artifactDir"
                }
                Write-Host "Downloaded artifacts: $($items.Name -join ', ')"

            - name: Verify artefact manifest and checksum
              shell: pwsh
              env:
                EXPECTED_COMMIT: ${{ github.event.workflow_run.head_sha }}
                ARTIFACT_DIR: ${{ runner.temp }}\deployment-artifact
              run: |
                $ErrorActionPreference = 'Stop'

                $manifestPath = Join-Path $env:ARTIFACT_DIR 'manifest.json'
                if (-not (Test-Path $manifestPath)){
                    throw "Artifact manifest not found: $manifestPath"
                }

                $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json

                if ($manifest.commit -ne $env:EXPECTED_COMMIT) {
                    throw "Artifact commit mismatch. Expected $env:EXPECTED_COMMIT, got $($manifest.commit)."
                }

                $expectedPackageName = "MyComApi-$env:EXPECTED_COMMIT.zip"
                $packagePath = Join-Path $env:ARTIFACT_DIR $expectedPackageName

                if (-not (Test-Path $packagePath)) {
                    throw "Expected deployment package not found: $packagePath"
                }

                $package = Get-Item $packagePath


                $checksumFile = "$($package.FullName).sha256"
                if (-not (Test-Path $checksumFile)) {
                    throw "Checksum file not found: $checksumFile"
                }

                $expectedHash = (Get-Content $checksumFile -Raw).Trim().Split([char[]]" ")[0].ToLowerInvariant()
                $actualHash = (Get-FileHash $package.FullName -Algorithm SHA256).Hash.ToLowerInvariant()

                if ($expectedHash -ne $actualHash) {
                    throw "SHA256 verification failed. Expected $expectedHash, got $actualHash."
                }

                Write-Host "Verified commit: $($manifest.commit)"
                Write-Host "Verified SHA256: $actualHash"

            - name: Deploy
              shell: pwsh
              env:
                ARTIFACT_DIR: ${{ runner.temp }}\deployment-artifact
                EXPECTED_COMMIT: ${{ github.event.workflow_run.head_sha }}
                SERVICE_NAME: ${{ env.SERVICE_NAME }}
                DEPLOY_ROOT: ${{ env.DEPLOY_ROOT }}
                HEALTH_URL: ${{ env.HEALTH_URL }}
              run: |
                $ErrorActionPreference = 'Stop'

                & .\deploy\Deploy-WindowsService.ps1 `
                  -ServiceName "${{ env.SERVICE_NAME }}" `
                  -DeployRoot "${{ env.DEPLOY_ROOT }}" `
                  -ArtifactDirectory "${{ env.ARTIFACT_DIR }}" `
                  -ExpectedCommit "${{ env.EXPECTED_COMMIT }}" `
                  -HealthUrl "${{ env.HEALTH_URL }}"

            - name: Health check
              shell: pwsh
              run: |
                $ErrorActionPreference = 'Stop'
                $response = Invoke-WebRequest -Uri '${{ env.HEALTH_URL }}' -UseBasicParsing -TimeoutSec 15
                if ($response.StatusCode -ne 200) {
                    throw "Health check returned HTTP $($response.StatusCode)"
                }
                Write-Host $response.Content